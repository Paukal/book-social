spring.application.name=author-service
server.port=8082
logging.level.root=debug

#DB
#spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5450/book_social}
spring.datasource.url=${DB_URL:jdbc:postgresql://postgres:5432/book_social}
spring.datasource.username=${DB_USER:book_social}
spring.datasource.password=${DB_PSW:book_social}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.default_schema=${DB_DEFAULT_SCHEMA:public}

#liquibase
spring.liquibase.change-log=classpath:liquibase/changelog_master.xml
spring.liquibase.enabled=true
#spring.liquibase.url=${DB_URL:jdbc:postgresql://localhost:5450/book_social}
spring.liquibase.url=${DB_URL:jdbc:postgresql://postgres:5432/book_social}
spring.liquibase.driver-class-name=org.postgresql.Driver
spring.liquibase.user=${DB_USER:book_social}
spring.liquibase.password=${DB_PSW:book_social}

spring.rabbitmq.host=rabbitmq
