version: "3.8"
services:
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.2
    command: start-dev
    ports:
      - "8085:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    # Optional: persist data
    # volumes:
    #   - keycloak_data:/opt/keycloak/data

# volumes:
#   keycloak_data: