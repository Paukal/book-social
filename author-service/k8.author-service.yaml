# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: author-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: author-service
  template:
    metadata:
      labels:
        app: author-service
    spec:
      containers:
        - name: author-service
          image: author-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8082

---
# Service
apiVersion: v1
kind: Service
metadata:
  name: author-service
spec:
  selector:
    app: author-service
  ports:
    - protocol: TCP
      port: 8082
      targetPort: 8082
  type: ClusterIP